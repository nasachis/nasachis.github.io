  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ction: column; gap: {{ density.gapSm }};\">\n                      <sc-for list=\"{{ productMaterials }}\" as=\"mp\" hint-placeholder-count=\"6\">\n                        <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid {{ theme.dividerColor }}; padding-top: {{ density.gapSm }};\">\n                          <span style=\"font: 700 12.5px 'Nunito Sans', sans-serif; color: {{ theme.headingColor }};\">{{ mp.material }}<\u002Fspan>\n                          <span style=\"font: 600 11.5px 'Nunito Sans', sans-serif; color: {{ theme.mutedColor }}; text-align: right;\">{{ mp.part }}<\u002Fspan>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- SUSTAINABILITY -->\n            <sc-if value=\"{{ isSustain }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background: {{ accentSoft }}; border-radius: {{ theme.radiusMd }}; padding: {{ density.padMd }} 20px; margin-bottom: 20px;\">\n                <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px;\">\n                  <span style=\"font: 800 13px 'Nunito Sans', sans-serif; color: {{ accentDark }}; letter-spacing: 0.3px;\">ÍNDICE DE REPARABILIDAD<\u002Fspan>\n                  <span style=\"font: 800 20px 'Nunito Sans', sans-serif; color: {{ accentDark }};\">7.9<span style=\"font-size: 12px; opacity: .55;\"> /10<\u002Fspan><\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"height: 10px; border-radius: 6px; background: rgba(18,50,71,0.1); overflow: hidden; margin-bottom: 6px;\">\n                  <div style=\"height: 100%; width: 79%; border-radius: 6px; background: {{ accent }};\"><\u002Fdiv>\n                <\u002Fdiv>\n                \n              <\u002Fdiv>\n\n              <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: {{ density.gapMd }};\">\n                <sc-for list=\"{{ sustainMetrics }}\" as=\"m\" hint-placeholder-count=\"6\">\n                  <div style=\"border: {{ theme.cardBorder }}; background: {{ theme.cardBg }}; box-shadow: {{ theme.cardShadow }}; border-radius: {{ theme.radiusMd }}; padding: {{ density.padSm }};\">\n                    <div style=\"font: 800 18px 'Nunito Sans', sans-serif; color: {{ accentDark }}; margin-bottom: 3px;\">{{ m.value }}<\u002Fdiv>\n                    <div style=\"font: 600 11.5px/1.35 'Nunito Sans', sans-serif; color: {{ theme.bodyColor }};\">{{ m.label }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- MAINTENANCE -->\n            <sc-if value=\"{{ isMaint }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"font: 500 12.5px/1.55 'Nunito Sans', sans-serif; color: {{ theme.mutedColor }}; margin: -6px 0 10px;\">Guía simplificada de sustitución de componentes prioritarios. Toca cada componente para ver los pasos.<\u002Fp>\n              <p style=\"font: 500 12.5px/1.55 'Nunito Sans', sans-serif; color: {{ theme.mutedColor }}; margin: 0 0 18px;\">Consulta el manual detallado completo en <a href=\"https://www.upv.es/soporte/manuales/robot-valse\" target=\"_blank\" rel=\"noopener\" style=\"color: {{ accent }}; font-weight: 700; text-decoration: none;\">upv.es/soporte/manuales/robot-valse<\u002Fa>.<\u002Fp>\n              <div style=\"display: flex; flex-direction: column; gap: {{ density.gapSm }};\">\n                <sc-for list=\"{{ maintItems }}\" as=\"it\" hint-placeholder-count=\"5\">\n                  <div style=\"border: {{ theme.cardBorder }}; background: {{ theme.cardBg }}; box-shadow: {{ theme.cardShadow }}; border-radius: {{ theme.radiusMd }}; overflow: hidden;\">\n                    <button onclick=\"{{ it.toggle }}\" style=\"width: 100%; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: {{ density.padSm }} 14px; text-align: left;\">\n                      <img src=\"{{ it.img }}\" alt=\"{{ it.name }}\" style=\"width: 46px; height: 46px; border-radius: 8px; flex-shrink: 0; object-fit: contain; background: #ffffff; border: 1px solid {{ theme.dividerColor }};\">\n                      <div style=\"flex: 1;\">\n                        <div style=\"font: 700 14px 'Nunito Sans', sans-serif; color: {{ theme.headingColor }};\">{{ it.name }}<\u002Fdiv>\n                        <div style=\"font: 600 11px 'Nunito Sans', sans-serif; color: {{ theme.mutedColor }}; margin-top: 1px;\">{{ it.freq }}<\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"font: 700 16px 'Nunito Sans', sans-serif; color: {{ accent }}; transform: {{ it.chevron }}; transition: transform .15s ease;\">⌄<\u002Fdiv>\n                    <\u002Fbutton>\n                    <sc-if value=\"{{ it.open }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"padding: 4px 16px 16px 72px; display: flex; flex-direction: column; gap: 6px;\">\n                        <sc-for list=\"{{ it.steps }}\" as=\"s\" hint-placeholder-count=\"2\">\n                          <div style=\"font: 500 12.5px/1.5 'Nunito Sans', sans-serif; color: {{ theme.bodyColor }}; display: flex; gap: 8px;\">\n                            <span style=\"color: {{ accent }}; font-weight: 800;\">·<\u002Fspan><span>{{ s }}<\u002Fspan>\n                          <\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- EOL -->\n            <sc-if value=\"{{ isEol }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display: flex; gap: 14px; align-items: flex-start; background: {{ accentSoft }}; border-radius: 14px; padding: 16px 18px; margin-bottom: 18px;\">\n                \n                <img src=\"https://nasachis.github.io/fotos_pasaporte/basura.png\" alt=\"Símbolo RAEE: contenedor tachado\" style=\"width: 54px; height: 67px; object-fit: contain; flex-shrink: 0\"><div style=\"font: 600 12.5px/1.55 'Nunito Sans', sans-serif; color: {{ theme.bodyColor }};\">No deposites este producto en el contenedor de residuos domésticos. Es un RAEE: llévalo a un punto limpio o a un distribuidor adherido a la recogida selectiva.<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div>\n                <div style=\"font: 800 13px 'Nunito Sans', sans-serif; color: {{ theme.headingColor }}; letter-spacing: 0.3px; margin-bottom: 10px;\">PROGRAMA DE RETORNO DEL FABRICANTE<\u002Fdiv>\n                <div style=\"display: flex; flex-direction: column; gap: {{ density.gapMd }};\">\n                  <div style=\"border: {{ theme.cardBorder }}; background: {{ theme.cardBg }}; box-shadow: {{ theme.cardShadow }}; border-radius: {{ theme.radiusMd }}; padding: {{ density.padMd }} 16px;\">\n                    <div style=\"font: 800 13.5px 'Nunito Sans', sans-serif; color: {{ accentDark }}; margin-bottom: 6px;\">Opción 1 · ¿Funciona?<\u002Fdiv>\n                    <p style=\"font: 500 12.5px/1.6 'Nunito Sans', sans-serif; color: {{ theme.bodyColor }}; margin: 0;\">Devuélvelo al fabricante. Si pasa la revisión se recondiciona y revende como \"Certified Refurbished\". Tú recibes un descuento del 15% en el siguiente modelo.<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"border: {{ theme.cardBorder }}; background: {{ theme.cardBg }}; box-shadow: {{ theme.cardShadow }}; border-radius: {{ theme.radiusMd }}; padding: {{ density.padMd }} 16px;\">\n                    <div style=\"font: 800 13.5px 'Nunito Sans', sans-serif; color: {{ accentDark }}; margin-bottom: 6px;\">Opción 2 · ¿No funciona?<\u002Fdiv>\n                    <p style=\"font: 500 12.5px/1.6 'Nunito Sans', sans-serif; color: {{ theme.bodyColor }}; margin: 0;\">Llévalo al punto limpio RAEE más cercano.<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- COMPLIANCE -->\n            <sc-if value=\"{{ isCompliance }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"font: 500 12.5px/1.55 'Nunito Sans', sans-serif; color: {{ theme.mutedColor }}; margin: -6px 0 18px;\">Normativa y certificaciones aplicables al producto y su ciclo de vida.<\u002Fp>\n              <div style=\"display: flex; flex-direction: column; gap: {{ density.gapSm }};\">\n                <sc-for list=\"{{ complianceGroups }}\" as=\"g\" hint-placeholder-count=\"6\">\n                  <div style=\"border: {{ theme.cardBorder }}; background: {{ theme.cardBg }}; box-shadow: {{ theme.cardShadow }}; border-radius: {{ theme.radiusMd }}; overflow: hidden;\">\n                    <button onclick=\"{{ g.toggle }}\" style=\"width: 100%; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: {{ density.padSm }} 14px; text-align: left;\">\n                      <span style=\"font: 700 13.5px 'Nunito Sans', sans-serif; color: {{ theme.headingColor }};\">{{ g.title }}<\u002Fspan>\n                      <span style=\"font: 700 16px 'Nunito Sans', sans-serif; color: {{ accent }}; transform: {{ g.chevron }}; transition: transform .15s ease; flex-shrink: 0;\">⌄<\u002Fspan>\n                    <\u002Fbutton>\n                    <sc-if value=\"{{ g.open }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"padding: 2px 14px 14px; display: flex; flex-direction: column; gap: 10px;\">\n                        <sc-for list=\"{{ g.items }}\" as=\"it2\" hint-placeholder-count=\"2\">\n                          <div>\n                            <div style=\"font: 700 12px 'JetBrains Mono', monospace; color: {{ accentDark }};\">{{ it2.code }}<\u002Fdiv>\n                            <div style=\"font: 500 12px/1.5 'Nunito Sans', sans-serif; color: {{ theme.bodyColor }}; margin-top: 2px;\">{{ it2.desc }}<\u002Fdiv>\n                          <\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: {&quot;width&quot;: 460, &quot;height&quot;: 920},\n  &quot;theme&quot;: {\n    &quot;editor&quot;: &quot;enum&quot;,\n    &quot;default&quot;: &quot;friendly&quot;,\n    &quot;options&quot;: [&quot;friendly&quot;, &quot;clinical&quot;, &quot;premiumDark&quot;],\n    &quot;tsType&quot;: &quot;'friendly' | 'clinical' | 'premiumDark'&quot;,\n    &quot;section&quot;: &quot;Estilo&quot;\n  },\n  &quot;density&quot;: {\n    &quot;editor&quot;: &quot;enum&quot;,\n    &quot;default&quot;: &quot;comfortable&quot;,\n    &quot;options&quot;: [&quot;comfortable&quot;, &quot;compact&quot;],\n    &quot;tsType&quot;: &quot;'comfortable' | 'compact'&quot;,\n    &quot;section&quot;: &quot;Estilo&quot;\n  },\n  &quot;navLayout&quot;: {\n    &quot;editor&quot;: &quot;enum&quot;,\n    &quot;default&quot;: &quot;list&quot;,\n    &quot;options&quot;: [&quot;list&quot;, &quot;grid&quot;],\n    &quot;tsType&quot;: &quot;'list' | 'grid'&quot;,\n    &quot;section&quot;: &quot;Estilo&quot;\n  }\n}\">\nconst THEMES = {\n  friendly: {\n    pageBg: '#ffffff', headerBg: 'transparent',\n    headingColor: '#123247', bodyColor: 'rgba(18,50,71,0.62)', mutedColor: 'rgba(18,50,71,0.5)',\n    cardBg: '#ffffff', cardBorder: 'none', cardShadow: '0 6px 18px rgba(18,50,71,0.08)',\n    radiusLg: '22px', radiusMd: '16px', radiusSm: '10px',\n    navPillShadow: '0 4px 10px rgba(18,50,71,0.14)', navPillRadius: '14px',\n    dividerColor: 'rgba(18,50,71,0.12)', heroCardBg: 'transparent', headingWeight: 800,\n  },\n  clinical: {\n    pageBg: '#fbfbfb', headerBg: 'transparent',\n    headingColor: '#0f2733', bodyColor: 'rgba(15,39,51,0.68)', mutedColor: 'rgba(15,39,51,0.5)',\n    cardBg: '#ffffff', cardBorder: '1px solid rgba(15,39,51,0.18)', cardShadow: 'none',\n    radiusLg: '6px', radiusMd: '4px', radiusSm: '3px',\n    navPillShadow: 'none', navPillRadius: '4px',\n    dividerColor: 'rgba(15,39,51,0.16)', heroCardBg: 'transparent', headingWeight: 700,\n  },\n  premiumDark: {\n    pageBg: '#111c1f', headerBg: 'transparent',\n    headingColor: '#f3f7f6', bodyColor: 'rgba(255,255,255,0.68)', mutedColor: 'rgba(255,255,255,0.48)',\n    cardBg: '#1a282c', cardBorder: '1px solid rgba(255,255,255,0.08)', cardShadow: '0 12px 28px rgba(0,0,0,0.45)',\n    radiusLg: '24px', radiusMd: '16px', radiusSm: '12px',\n    navPillShadow: '0 10px 22px rgba(0,0,0,0.5)', navPillRadius: '16px',\n    dividerColor: 'rgba(255,255,255,0.12)', heroCardBg: '#1a282c', headingWeight: 700,\n  },\n};\n\nconst DENSITIES = {\n  comfortable: { padLg: '22px', padMd: '18px', padSm: '14px', gapLg: '16px', gapMd: '12px', gapSm: '8px', rowPad: '13px 0' },\n  compact: { padLg: '15px', padMd: '12px', padSm: '9px', gapLg: '10px', gapMd: '7px', gapSm: '5px', rowPad: '8px 0' },\n};\n\nfunction robotImgUrl(id, fallback) {\n  return (typeof window !== 'undefined' && window.__resources && window.__resources[id]) || fallback;\n}\nconst CASINGS = {\n  blanco: { name: 'Blanco', get img() { return 'https://nasachis.github.io/fotos_pasaporte/Robot%20modificado.png'; }, swatch: '#ffffff', accent: '#3fa7c4', accentDark: '#1c5f78', accentSoft: 'rgba(63,167,196,0.12)' },\n  azul: { name: 'Azul', get img() { return 'https://nasachis.github.io/fotos_pasaporte/Robot%20modificado%20azul.png'; }, swatch: '#bcdcee', accent: '#4f8fd6', accentDark: '#2c4f8c', accentSoft: 'rgba(79,143,214,0.12)' },\n  verde: { name: 'Verde', get img() { return 'https://nasachis.github.io/fotos_pasaporte/Robot%20modificado%20verde.png'; }, swatch: '#c8e6cf', accent: '#5fb37e', accentDark: '#2f6b47', accentSoft: 'rgba(95,179,126,0.12)' },\n  rosa: { name: 'Rosa', get img() { return 'https://nasachis.github.io/fotos_pasaporte/Robot%20modificado%20rosa.png'; }, swatch: '#f3d1de', accent: '#d97fa8', accentDark: '#96345f', accentSoft: 'rgba(217,127,168,0.12)' },\n};\n\nconst SECTION_TITLES = {\n  info: 'Información del producto',\n  sustain: 'Sostenibilidad y circularidad',\n  maint: 'Mantenimiento',\n  eol: 'Fin de vida',\n  compliance: 'Cumplimiento normativo',\n};\n\nconst MAINT_DATA = [\n  { id: 'filtro', name: 'Filtro HEPA', img: 'https://nasachis.github.io/fotos_pasaporte/filtro.png', freq: 'Sustituir cada 2–3 meses', steps: [\n    'Separe el depósito de polvo del robot apretando el botón de la parte superior.',\n    'Abra la puerta del depósito.',\n    'Extraiga el filtro (sin herramientas).',\n  ]},\n  { id: 'cepillo-central', name: 'Cepillo central', img: 'https://nasachis.github.io/fotos_pasaporte/cepilloprincipal.png', freq: 'Revisar cada mes · sustituir cada 6–12 meses', steps: [\n    'Abra la rejilla protectora del cepillo (elevando 2 pestañas amarillas).',\n    'Extraiga y limpie/sustituya los cepillos.',\n  ]},\n  { id: 'cepillo-lateral', name: 'Cepillo lateral', img: 'https://nasachis.github.io/fotos_pasaporte/cepillolat.png', freq: 'Sustituir cada 6 meses', steps: [\n    'Afloje el único tornillo Phillips que lo fija.',\n    'Limpie/sustituya el cepillo y vuelva a fijar el tornillo.',\n  ]},\n  { id: 'bateria', name: 'Batería', img: 'https://nasachis.github.io/fotos_pasaporte/bateria.png', freq: 'Vida útil ≥ 800 ciclos de carga', steps: [\n    'Apague el robot y retire la cubierta de la batería con un destornillador Phillips nº2.',\n    'Extraiga la batería.',\n    'Instale la batería de recambio y cierre la cubierta.',\n  ]},\n  { id: 'rueda', name: 'Rueda giratoria', img: 'https://nasachis.github.io/fotos_pasaporte/rueda.png', freq: 'Revisar cada 3 meses', steps: [\n    'Tire con fuerza de la rueda para retirarla.',\n    'Limpie el eje (empuje con fuerza para retirarlo) y la cavidad de la rueda de pelos y suciedad.',\n    'Inserte de nuevo la rueda hasta encajar el clip.',\n  ]},\n];\n\nconst PRODUCT_MATERIALS = [\n  { material: 'ABS reciclado (PCR ≥20%)', part: 'Chasis y carcasa' },\n  { material: 'Polipropileno (PP)', part: 'Cepillos central, lateral y filtro' },\n  { material: 'TPE', part: 'Ruedas laterales' },\n  { material: 'Policarbonato (PC)', part: 'Ventana del panel de sensores' },\n  { material: 'Li-ion (NMC)', part: 'Celda de batería' },\n  { material: 'Cobre y acero', part: 'Motor y componentes electrónicos' },\n];\n\nconst SUSTAIN_METRICS = [\n  { label: 'ABS reciclado post-consumo en piezas de carcasa', value: '≥20%' },\n  { label: 'Fracción recuperable del producto en masa', value: '>88%' },\n  { label: 'Vida útil garantizada    (≈950 h de uso)', value: '5 años' },\n  { label: 'Disponibilidad de piezas de recambio tras la discontinuación del producto', value: '10 años' },\n  { label: 'Batería sustituible por el usuario final', value: 'Sí' },\n  { label: 'Huella de carbono por unidad funcional y vida útil declarada', value: '127 kg CO2-eq' },\n];\n\nconst EOL_MATERIALS = [\n  { code: '>ABS(REC20)<', desc: 'Chasis y piezas de carcasa' },\n  { code: '>PP<', desc: 'Cepillos central, lateral y filtro' },\n  { code: '>TPE<', desc: 'Ruedas laterales' },\n  { code: '>PC<', desc: 'Ventanas del panel de sensores' },\n];\n\nconst COMPLIANCE_DATA = [\n  { id: 'ce', title: 'Marcado CE y seguridad eléctrica', items: [\n    { code: 'Reglamento (CE) 765/2008', desc: 'Marcado CE de conformidad con los requisitos de seguridad, salud y medio ambiente de la UE.' },\n    { code: 'UNE-EN IEC 60335-1:2024 / 60335-2-2:2024', desc: 'Requisitos generales y particulares de seguridad eléctrica para aspiradoras.' },\n    { code: 'UNE-EN IEC 55014-1/2:2021', desc: 'Compatibilidad electromagnética: emisiones e inmunidad.' },\n  ]},\n  { id: 'quim', title: 'Sustancias químicas', items: [\n    { code: 'Directiva RoHS 2011/65/UE + 2015/863/UE', desc: 'Restricción de plomo, mercurio, cadmio, cromo VI, PBB/PBDE y ftalatos.' },\n    { code: 'Reglamento REACH (CE) 1907/2006', desc: 'Ausencia de sustancias SVHC (ftalatos, PFAS, BPA…) por encima del 0,1% en masa.' },\n  ]},\n  { id: 'bat', title: 'Baterías', items: [\n    { code: 'Reglamento (UE) 2023/1542', desc: 'Etiquetado, química declarada, ausencia de Hg/Cd/Pb y batería desmontable por el usuario.' },\n    { code: 'UNE-EN 62133-2:2017/A1:2021', desc: 'Seguridad de baterías Li-ion: cortocircuito, sobrecarga, aplastamiento y temperatura.' },\n  ]},\n  { id: 'raee', title: 'RAEE y gestión de residuos', items: [\n    { code: 'Directiva 2012/19/UE · RD 110/2015', desc: 'Responsabilidad ampliada del productor, registro RPAEE y recogida selectiva.' },\n    { code: 'UNE-EN 50419:2023', desc: 'Etiquetado con el símbolo del contenedor tachado.' },\n  ]},\n  { id: 'espr', title: 'Ecodiseño, reparabilidad y DPP', items: [\n    { code: 'Plan de trabajo ESPR 2025–2030', desc: 'Requisitos de durabilidad, reparabilidad, reciclabilidad y contenido reciclado.' },\n    { code: 'Directiva (UE) 2024/1799 — Derecho a reparar', desc: 'Disponibilidad de piezas y precios de reparación transparentes, sin discriminar reparadores independientes.' },\n    { code: 'ISO/IEC 15459-2 · GS1 Digital Link', desc: 'Trazabilidad del Pasaporte Digital de Producto mediante QR dinámico.' },\n  ]},\n  { id: 'garantia', title: 'Garantías, ensayos y consumo', items: [\n    { code: 'RDL 1/2007 (TRLGDCU) · Directiva (UE) 2019/771', desc: 'Garantía legal de 3 años sobre el producto.' },\n    { code: 'UNE-EN 60312:2017 · UNE-EN 1822-1:2020', desc: 'Ensayos de succión y eficiencia de filtración HEPA (≥99,97%).' },\n    { code: 'Directiva (UE) 2024/825', desc: 'Prohibición de alegaciones ambientales genéricas sin respaldo técnico.' },\n  ]},\n];\n\nclass Component extends DCLogic {\n  state = {\n    screen: 'home',\n    casing: 'blanco',\n    openMaint: null,\n    openCompliance: null,\n    openMaterials: false,\n  };\n\n  goTo(screen) { this.setState({ screen }); }\n  goHome() { this.setState({ screen: 'home' }); }\n  setCasing(key) { this.setState({ casing: key }); }\n  toggleMaint(id) { this.setState(s => ({ openMaint: s.openMaint === id ? null : id })); }\n  toggleCompliance(id) { this.setState(s => ({ openCompliance: s.openCompliance === id ? null : id })); }\n  toggleMaterials() { this.setState(s => ({ openMaterials: !s.openMaterials })); }\n\n  renderVals() {\n    const c = CASINGS[this.state.casing];\n    const screen = this.state.screen;\n    const isHome = screen === 'home';\n    const theme = THEMES[this.props.theme] || THEMES.friendly;\n    const density = DENSITIES[this.props.density] || DENSITIES.comfortable;\n    const isGridNav = (this.props.navLayout || 'list') === 'grid';\n\n    const navButtons = [\n      { label: 'Información del producto', short: 'Información', initial: 'i', go: () => this.goTo('info') },\n      { label: 'Sostenibilidad y circularidad', short: 'Sostenibilidad', initial: 'S', go: () => this.goTo('sustain') },\n      { label: 'Mantenimiento', short: 'Mantenimiento', initial: 'M', go: () => this.goTo('maint') },\n      { label: 'Fin de vida', short: 'Fin de vida', initial: 'F', go: () => this.goTo('eol') },\n      { label: 'Cumplimiento normativo', short: 'Normativa', initial: 'N', go: () => this.goTo('compliance') },\n    ];\n\n    const swatches = Object.keys(CASINGS).map(key => ({\n      name: CASINGS[key].name,\n      color: CASINGS[key].swatch,\n      select: () => this.setCasing(key),\n    }));\n\n    const infoFields = [\n      { label: 'Modelo', value: 'Robot Valse' },\n      { label: 'Fabricante', value: 'UPV' },\n      { label: 'Localización fábrica', value: 'Shenzhen, China' },\n      { label: 'Categoría', value: 'Pequeño electrodoméstico (AEE)' },\n      { label: 'Año de fabricación', value: '2026' },\n    ];\n\n    const maintItems = MAINT_DATA.map(m => ({\n      ...m,\n      open: this.state.openMaint === m.id,\n      chevron: this.state.openMaint === m.id ? 'rotate(180deg)' : 'rotate(0deg)',\n      toggle: () => this.toggleMaint(m.id),\n    }));\n\n    const complianceGroups = COMPLIANCE_DATA.map(g => ({\n      ...g,\n      open: this.state.openCompliance === g.id,\n      chevron: this.state.openCompliance === g.id ? 'rotate(180deg)' : 'rotate(0deg)',\n      toggle: () => this.toggleCompliance(g.id),\n    }));\n\n    return {\n      isHome,\n      screen,\n      theme,\n      density,\n      isGridNav,\n      goHome: () => this.goHome(),\n      accent: c.accent,\n      accentDark: c.accentDark,\n      accentSoft: c.accentSoft,\n      robotImg: c.img,\n      navButtons,\n      swatches,\n      sectionTitle: SECTION_TITLES[screen] || '',\n      isInfo: screen === 'info',\n      isSustain: screen === 'sustain',\n      isMaint: screen === 'maint',\n      isEol: screen === 'eol',\n      isCompliance: screen === 'compliance',\n      infoFields,\n      productMaterials: PRODUCT_MATERIALS,\n      materialsOpen: this.state.openMaterials,\n      materialsChevron: this.state.openMaterials ? 'rotate(180deg)' : 'rotate(0deg)',\n      toggleMaterials: () => this.toggleMaterials(),\n      sustainMetrics: SUSTAIN_METRICS,\n      maintItems,\n      eolMaterials: EOL_MATERIALS,\n      complianceGroups,\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
